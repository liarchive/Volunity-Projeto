<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar</title>
<link rel="stylesheet" href="_css/estilo.css">

</head>
<body>

  <div class="fundo-login">
    <div class="cartao">

      <h1 class="titulo-cartao">Bem-vindo de volta!</h1>
      <p class="subtitulo-cartao">Entre na sua conta para continuar</p>

      <div class="abas">
        <button type="button" class="aba aba-ativa" id="aba-voluntario" onclick="trocarAba('voluntario')">Voluntário</button>
        <button type="button" class="aba" id="aba-instituicao" onclick="trocarAba('instituicao')">Instituição</button>
      </div>

      <form onsubmit="entrar(event)">
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com">
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="••••••••">
        </div>

        <div class="linha-opcoes">
          <label class="lembrar-mim">
            <input type="checkbox">
            Lembrar de mim
          </label>
          <a href="#" class="link-roxo">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="botao botao-principal botao-largo">Entrar</button>
        
      </form>

      <p class="separador">ou</p>

      <a href="criar-conta.html" class="botao botao-contorno botao-largo">Criar conta</a>

      <p class="voltar-inicio">
        <a href="index.html">&larr; Voltar para a página inicial</a>
      </p>

    </div>
  </div>

  <script src="_javascript/script.js"></script>
</body>
</html>
