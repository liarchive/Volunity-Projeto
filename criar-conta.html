<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta</title>
<link rel="stylesheet" href="_css/estilo.css">
</head>
<body>

  <div class="fundo-login">
    <div class="cartao cartao-cadastro">

      <h1 class="titulo-cartao">Crie sua conta</h1>
      <p class="subtitulo-cartao">Escolha seu perfil para começar</p>

      <div class="opcoes-perfil">
        <div class="perfil perfil-selecionado" id="perfil-voluntario" onclick="escolherPerfil('voluntario')">
        
          <p class="perfil-titulo">Quero ser voluntário</p>
          <p class="perfil-descricao">Encontre oportunidades e participe de ações</p>
        </div>
        <div class="perfil" id="perfil-instituicao" onclick="escolherPerfil('instituicao')">
            
          <p class="perfil-titulo">Sou uma instituição</p>
          <p class="perfil-descricao">Publique vagas e gerencie voluntários</p>
        </div>
      </div>

      <form onsubmit="criarConta(event)">
        <div class="campo">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" placeholder="Digite seu nome">
        </div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com">
        </div>

        <div class="linha-dupla">
          <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="••••••••">
          </div>
          <div class="campo">
            <label for="confirmar-senha">Confirmar senha</label>
            <input type="password" id="confirmar-senha" placeholder="••••••••">
          </div>
        </div>

        <div class="campo">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" placeholder="São Paulo, SP">
        </div>

        <div class="campo">
          <label>Áreas de interesse</label>
          <div class="tags">
            <span class="tag" onclick="alternarTag(this)">Animais</span>
            <span class="tag" onclick="alternarTag(this)">Educação</span>
            <span class="tag" onclick="alternarTag(this)">Meio ambiente</span>
            <span class="tag" onclick="alternarTag(this)">Assistência social</span>
            <span class="tag" onclick="alternarTag(this)">Saúde</span>
            <span class="tag" onclick="alternarTag(this)">Direitos humanos</span>
          </div>
        </div>

        <label class="lembrar-mim termos">
          <input type="checkbox">
          Aceito os <a href="#" class="link-roxo">Termos de Uso</a> e a <a href="#" class="link-roxo">Política de Privacidade</a>
        </label>

        <button type="submit" class="botao botao-principal botao-largo" id="botao-continuar">Continuar como voluntário</button>
      </form>

      <p class="voltar-inicio">
        <a href="index.html">&larr; Voltar para a página inicial</a>
      </p>

    </div>
  </div>

  <script src="_javascript/script.js"></script>
</body>
</html>
